<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le Pin — меню</title>
  <meta name="description" content="Меню ресторана и бара Le Pin, отель «Дом у озера», озеро Щучье">
  <meta name="theme-color" content="#faf8f3">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Шапка: логотип и переключатель языка -->
  <header class="hero">
    <div class="lang" role="group" aria-label="Язык / Тіл">
      <button class="lang__btn is-active" type="button" data-lang="ru">РУС</button>
      <button class="lang__btn" type="button" data-lang="kk">ҚАЗ</button>
    </div>
    <img class="hero__logo" src="img/logo.png" alt="Le Pin Restaurant" width="320" height="199">
    <p class="hero__place" data-place></p>
  </header>

  <!-- Липкая навигация: вкладки Кухня/Бар + категории -->
  <nav class="nav" aria-label="Разделы меню">
    <div class="tabs" role="tablist" data-tabs></div>
    <div class="chips" data-chips></div>
  </nav>

  <!-- Сюда JS выводит категории и блюда -->
  <main class="menu" data-menu>
    <p class="menu__loading">Загружаем меню…</p>
  </main>

  <footer class="footer">
    <p data-footer-note></p>
    <p class="footer__brand">LE PIN</p>
  </footer>

  <script src="js/menu.js"></script>
</body>
</html>
